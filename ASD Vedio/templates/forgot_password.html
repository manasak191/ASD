<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            background-color: #f4f4f4;
        }

        /* Add background image with blur effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../static/img/smartgaze-1.jpg') no-repeat center center/cover; /* Replace with your image URL */
            filter: blur(8px); /* Adjust the blur value as needed */
            z-index: -1; /* Keep the image behind the content */
        }

        /* Form Styles (same as Login & Register) */
        .login {
            background-color: #ffffffb5;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            z-index: 1; /* Ensure the form stays in front of the background */
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #ef4033;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #ef4033;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #ef4033a6;
        }

        .msg {
            color: red;
            margin-bottom: 15px;
        }

        p a {
            text-decoration: none;
            color: #ef4033;
        }

        p a:hover {
            color: #ef4033a6;
        }

    </style>
</head>
<body>
    <div class="login">
        <h1>Forgot Password</h1>
        <form action="{{ url_for('forgot_password') }}" method="post">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="submit" value="Send Reset Link">
        </form>
        <div class="msg">{{ msg }}</div>
    </div>
</body>
</html>
