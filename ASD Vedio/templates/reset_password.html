<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            background-color: #f4f4f4;
        }

        /* Add background image with blur effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../static/img/smartgaze-1.jpg') no-repeat center center/cover; /* Replace with your image URL */
            filter: blur(8px); /* Adjust the blur value as needed */
            z-index: -1; /* Keep the image behind the content */
        }

        /* Form Styles (same as Login & Register) */
        form {
            background-color: #ffffffb5;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            z-index: 1; /* Ensure the form stays in front of the background */
        }

        h2 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #ef4033;
        }

        label {
            display: none;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #ef4033;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #ef4033a6;
        }

        .msg {
            color: red;
            margin-bottom: 15px;
        }

        p a {
            text-decoration: none;
            color: #ef4033;
        }

        p a:hover {
            color: #ef4033a6;
        }
    </style>
</head>
<body>
    <form method="POST" action="/reset_password">
        <h2>Reset Your Password</h2>
        {% if msg %}
            <p>{{ msg }}</p>
        {% endif %}
        <label for="username">
            <i class="fas fa-user"></i>
        </label>
        <input type="text" id="username" name="username" placeholder="Username" required>

        <label for="newpassword">
            <i class="fas fa-lock"></i>
        </label>
        <input type="password" id="newpassword" name="newpassword" placeholder="New Password" required>

        <label for="confirmpassword">
            <i class="fas fa-lock"></i>
        </label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm New Password" required>

        <input type="submit" value="Reset Password">
    </form>
</body>
</html>
