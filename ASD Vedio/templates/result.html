<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prediction Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Classification Result</h2>

    <p class="text-lg mb-4 text-gray-700">
      The uploaded audio is classified as:<br>
      <span class="font-extrabold text-blue-700 text-2xl">
        {{ prediction }}
      </span>
    </p>

    <!-- Audio Player -->
    <div class="mt-4 mb-6">
      <p class="text-sm text-gray-500 mb-2">Play uploaded voice sample:</p>
      <audio id="audioPlayer" controls class="w-full">
        <source src="{{ audio_url }}" type="audio/wav">
        Your browser does not support the audio element.
      </audio>
    </div>

    <a href="/"
       class="inline-block mt-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">
      Try Another File
    </a>
  </div>

  <!-- Optional JS: log when audio starts -->
  <script>
    const player = document.getElementById('audioPlayer');
    player.addEventListener('play', () => {
      console.log('Playing predicted voice file:', "{{ file }}");
    });
  </script>
</body>
</html>
